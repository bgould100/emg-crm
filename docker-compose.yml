services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: emg-api:local
    container_name: emg-api-local
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      EMG_ALLOWED_ORIGIN: http://localhost:8000
    volumes:
      - ./data/uploads:/app/data/uploads
    networks:
      - emg-network
    restart: unless-stopped

networks:
  emg-network:
    external: true