services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: emg-api:local
    container_name: emg-api-local
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://emg:emg_dev_password@emg-postgres:5432/emg
    networks:
      - emg-network
    restart: unless-stopped

networks:
  emg-network:
    external: true
