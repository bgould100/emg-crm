services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: emg-api:local
    container_name: emg-api-local
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      EMG_ALLOWED_ORIGIN: ${EMG_ALLOWED_ORIGIN:-http://localhost:8000}
    volumes:
      - ./data/uploads:/app/data/uploads
    networks:
      - emg-network
    restart: unless-stopped


  invoice-delivery-worker:
    image: emg-api:local
    container_name: emg-invoice-delivery-worker
    command:
      - python
      - -m
      - app.workers.contractor_invoice_delivery_worker
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
    networks:
      - emg-network
    profiles:
      - invoice-delivery
    restart: unless-stopped

  homeowner-review-delivery-worker:
    image: emg-api:local
    container_name: emg-homeowner-review-delivery-worker
    command:
      - python
      - -m
      - app.workers.homeowner_review_delivery_worker
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
    networks:
      - emg-network
    profiles:
      - homeowner-review-delivery
    restart: unless-stopped

networks:
  emg-network:
    external: true